<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Computer Science | Exam Simulator</title>
<style>
:root{--purple:#642d9a;--violet:#7638d3;--dark:#24202c;--muted:#746f80;--line:#e7e1ee;--pale:#f6f1fc;--green:#147d56;--red:#bb3d54;--bg:#f5f3f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--dark)}button,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:1140px;margin:40px auto;background:#fff;min-height:650px;display:grid;grid-template-columns:36% 64%;box-shadow:0 18px 60px #291b3818;border-radius:18px;overflow:hidden}.hero{background:linear-gradient(155deg,#582388,#6d31a7);color:#fff;padding:54px 40px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.hero:before,.hero:after{content:"";position:absolute;border:1px solid #ffffff2e;border-radius:50%;width:380px;height:380px;right:-240px;bottom:45px}.hero:after{width:260px;height:260px;right:-150px;bottom:110px}.eyebrow{font-size:12px;letter-spacing:3px;font-weight:800;color:#d5b3f4}.dash{width:44px;height:4px;background:#d9b5fa;margin:15px 0 22px}.hero h1{font-size:clamp(35px,4vw,58px);line-height:1.06;letter-spacing:-2px;margin:0;text-transform:uppercase}.hero p{line-height:1.7;color:#e9d8f6;max-width:270px}.hero .small{font-size:13px;color:#d7bdec;position:relative}.main{padding:48px 50px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.overline{color:var(--purple);font-weight:800;font-size:12px;letter-spacing:2px;text-transform:uppercase}h2{font-size:34px;letter-spacing:-1.2px;margin:6px 0 22px;line-height:1.2}h3{margin:0 0 14px;font-size:20px}.sub{color:var(--muted);line-height:1.55;margin:-8px 0 24px}.mode,.option,.chapter{width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:18px;display:flex;gap:18px;align-items:center;margin-bottom:13px;transition:.15s}.mode:hover,.chapter:hover,.option:not(:disabled):hover{border-color:#a47ad8;background:#faf7ff}.mode strong{font-size:21px}.mode small{display:block;color:var(--muted);margin-top:5px;line-height:1.4}.num{background:#f1eafb;color:var(--violet);border-radius:13px;padding:13px 14px;font-size:18px;font-weight:800}.arrow{margin-left:auto;color:var(--violet);font-size:27px}.btn{border:0;border-radius:9px;background:var(--violet);color:#fff;padding:13px 21px;font-weight:700}.btn:hover{background:#5e29af}.btn.secondary{background:#f0e9fa;color:#58238a}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--dark)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.field{margin:22px 0}.field label{display:block;font-weight:700;margin-bottom:9px}.field select{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--dark)}.info{background:var(--pale);border:1px solid #e5d6f5;border-radius:9px;padding:16px;color:#4b3467;line-height:1.55}.statrow{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 22px}.pill{border-radius:30px;background:var(--pale);color:var(--purple);font-size:13px;font-weight:750;padding:8px 12px}.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:19px;color:var(--purple)}.timer.urgent{color:var(--red)}.progress{height:8px;background:#eee8f4;border-radius:20px;overflow:hidden;margin-bottom:28px}.bar{height:100%;background:var(--violet);transition:width .2s}.question{font-size:23px;font-weight:750;line-height:1.42;margin:18px 0 23px}.option{align-items:flex-start;font-size:15px;line-height:1.5;padding:14px 16px}.letter{flex:0 0 29px;height:29px;display:grid;place-items:center;background:var(--pale);color:var(--purple);border-radius:8px;font-weight:800}.option.selected{border-color:var(--violet);background:#f7f0ff}.option.correct{border-color:var(--green);background:#ecfaf4}.option.wrong{border-color:var(--red);background:#fff0f2}.feedback{padding:16px;border-radius:9px;margin-top:15px;line-height:1.55;background:#f4f1f8}.feedback.good{border-left:4px solid var(--green)}.feedback.bad{border-left:4px solid var(--red)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.qnav{margin-top:23px;display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.qnav button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 0;color:var(--muted);font-size:12px}.qnav button.answered{background:#e7d8f8;color:#582388}.qnav button.active{border:2px solid var(--violet);font-weight:800}.score{font-size:54px;font-weight:850;letter-spacing:-3px;color:var(--purple);margin:8px 0}.results{width:100%;border-collapse:collapse;margin-top:16px}.results th,.results td{padding:11px 8px;text-align:left;border-bottom:1px solid var(--line)}.results th{font-size:12px;color:var(--muted);text-transform:uppercase}.review{border:1px solid var(--line);border-radius:9px;margin:10px 0;padding:15px;line-height:1.5}.review summary{cursor:pointer;font-weight:700}.review p{margin:9px 0}.goodtxt{color:var(--green)}.badtxt{color:var(--red)}.muted{color:var(--muted)}.hidden{display:none!important}.error{color:#a1203b;background:#fff0f2;border-radius:9px;padding:16px;line-height:1.6}.footer{font-size:12px;color:var(--muted);margin-top:28px}@media(max-width:850px){.app{margin:0;min-height:100dvh;border-radius:0;grid-template-columns:1fr}.hero{padding:24px 22px;min-height:170px}.hero h1{font-size:33px;letter-spacing:-1px}.hero p{display:none}.hero .small{display:none}.dash{margin:9px 0 13px}.main{padding:26px 20px 40px}h2{font-size:29px}.question{font-size:20px}.qnav{grid-template-columns:repeat(10,1fr)}}@media(max-width:390px){.main{padding:22px 14px}.mode{padding:14px;gap:12px}.mode strong{font-size:18px}.qnav{grid-template-columns:repeat(8,1fr)}}
</style>
</head>
<body><div class="app"><aside class="hero"><div><div class="eyebrow">SELF-CHECK QUIZ</div><div class="dash"></div><h1>Computer<br>Science</h1><p>Eight chapters. Three difficulty levels. Practice at your own pace or take a timed exam.</p></div><div class="small">120 questions · 8 chapters · 100% English</div></aside><main class="main"><div id="view"></div></main></div>
<script>
'use strict';
const CHAPTERS=['Digitalization & Digital Business','Business Information Systems','Data Management & Analytics','Automation','Artificial Intelligence','Cybersecurity','Digital Compliance & Responsibility','Digital Projects & Implementation'];
const STORE='cs-quiz-wrong-v1';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
let bank=[],session=null,tick=null,wrongIds=new Set();
try{wrongIds=new Set(JSON.parse(localStorage.getItem(STORE)||'[]'))}catch{}
function persist(){try{localStorage.setItem(STORE,JSON.stringify([...wrongIds]))}catch{}}
function stopTimer(){if(tick){clearInterval(tick);tick=null}}
function render(html){$('#view').innerHTML=html}
function home(){stopTimer();session=null;render(`<div class="overline">Welcome</div><h2>Choose a mode.</h2><button class="mode" id="practice"><span class="num">01</span><span><strong>Practice Mode</strong><small>Choose a chapter and difficulty. Get immediate feedback and explanations.</small></span><span class="arrow">→</span></button><button class="mode" id="exam"><span class="num">02</span><span><strong>Exam Mode</strong><small>60 random questions · 30 minutes · grading and chapter breakdown.</small></span><span class="arrow">→</span></button><div class="info">${bank.length} questions loaded across 8 chapters. ${wrongIds.size} question(s) saved for review on this device.</div><p class="footer">Your answers stay in this browser. No account or server required.</p>`);$('#practice').onclick=setup;$('#exam').onclick=examIntro}
function setup(){render(`<div class="overline">Practice Mode</div><h2>Build your session.</h2><p class="sub">Choose one chapter and the level you want to practise.</p><div class="field"><label for="chapter">Chapter</label><select id="chapter">${CHAPTERS.map((n,i)=>`<option value="${i+1}">Chapter ${i+1} · ${esc(n)}</option>`).join('')}</select></div><div class="field"><label for="difficulty">Difficulty</label><select id="difficulty"><option value="all">All levels</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></div><div class="field"><label for="source">Question set</label><select id="source"><option value="all">All available questions</option><option value="wrong">Previously incorrect answers</option></select></div><div class="info" id="available"></div><div class="actions"><button class="btn" id="start">Start Practice →</button><button class="btn ghost" id="back">Back</button></div>`);let update=()=>{let p=practicePool();$('#available').textContent=`${p.length} question(s) available for this selection.`;$('#start').disabled=!p.length};['chapter','difficulty','source'].forEach(id=>$('#'+id).onchange=update);$('#start').onclick=()=>startSession('practice',shuffle(practicePool()));$('#back').onclick=home;update()}
function practicePool(){let c=Number($('#chapter').value),d=$('#difficulty').value,s=$('#source').value;return bank.filter(q=>q.chapter===c&&(d==='all'||q.difficulty===d)&&(s==='all'||wrongIds.has(q.id)))}
function examIntro(){render(`<div class="overline">Exam Mode</div><h2>Ready for the exam?</h2><div class="statrow"><span class="pill">60 questions</span><span class="pill">30 minutes</span><span class="pill">8 chapters</span></div><p class="sub">Questions are drawn randomly from all chapters and difficulty levels. You can change answers and move between questions until you submit.</p><div class="info">No feedback is shown during the exam. When time runs out, your answers are submitted automatically. A score above 50% is required to pass.</div><div class="actions"><button class="btn" id="start">Start 30-minute exam →</button><button class="btn ghost" id="back">Back</button></div>`);$('#start').onclick=()=>startSession('exam',shuffle(bank).slice(0,60));$('#back').onclick=home}
function startSession(mode,qs){if(!qs.length)return;stopTimer();session={mode,qs,answers:Array(qs.length).fill(null),index:0,started:Date.now(),deadline:mode==='exam'?Date.now()+30*60*1000:null,finished:false};showQuestion();if(mode==='exam'){tick=setInterval(()=>{if(!session||session.finished||session.mode!=='exam')return;let left=session.deadline-Date.now();if(left<=0){finish(true);return}updateClock()},250)}}
function updateClock(){let el=$('#clock');if(!el||!session)return;let t=Math.max(0,Math.ceil((session.deadline-Date.now())/1000));el.textContent=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;el.classList.toggle('urgent',t<=120)}
function showQuestion(){if(!session||session.finished)return;let s=session,i=s.index,q=s.qs[i],chosen=s.answers[i],revealed=s.mode==='practice'&&chosen!==null;let correct=chosen===q.correctIndex;render(`<div class="top"><span class="overline">${s.mode==='exam'?'Exam':'Practice'} · Chapter ${q.chapter} · ${esc(q.difficulty)}</span>${s.mode==='exam'?'<span id="clock" class="timer">30:00</span>':''}</div><div class="statrow"><span class="pill">Question ${i+1} / ${s.qs.length}</span><span class="pill">${s.answers.filter(a=>a!==null).length} answered</span></div><div class="progress"><div class="bar" style="width:${(i+1)/s.qs.length*100}%"></div></div><div class="question">${esc(q.question)}</div><div id="options">${q.options.map((o,j)=>`<button class="option ${chosen===j?'selected':''} ${revealed&&j===q.correctIndex?'correct':''} ${revealed&&chosen===j&&!correct?'wrong':''}" data-answer="${j}" ${revealed?'disabled':''}><span class="letter">${'ABCD'[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>${revealed?`<div class="feedback ${correct?'good':'bad'}"><strong>${correct?'Correct!':'Incorrect.'}</strong> Correct answer: ${'ABCD'[q.correctIndex]}.<p>${esc(q.explanation)}</p></div>`:''}<div class="actions"><button class="btn secondary" id="prev" ${i===0?'disabled':''}>← Previous</button><button class="btn" id="next">${i===s.qs.length-1?'Finish':'Next →'}</button>${s.mode==='exam'?'<button class="btn ghost" id="submit">Submit exam</button>':''}<button class="btn ghost" id="exit">Exit</button></div>${s.mode==='exam'?`<div class="qnav">${s.qs.map((_,j)=>`<button data-jump="${j}" class="${s.answers[j]!==null?'answered':''} ${i===j?'active':''}" aria-label="Question ${j+1}">${j+1}</button>`).join('')}</div>`:''}`);
$('#options').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(s.mode==='practice'&&s.answers[i]!==null)return;s.answers[i]=Number(b.dataset.answer);if(s.mode==='practice'){if(s.answers[i]===q.correctIndex)wrongIds.delete(q.id);else wrongIds.add(q.id);persist()}showQuestion()});$('#prev').onclick=()=>{s.index--;showQuestion()};$('#next').onclick=()=>{if(s.index===s.qs.length-1){if(s.mode==='exam'){confirmSubmit()}else finish(false)}else{s.index++;showQuestion()}};$('#exit').onclick=()=>{if(confirm('Exit this session? Your current progress will be lost.'))home()};if(s.mode==='exam'){$('#submit').onclick=confirmSubmit;document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{s.index=Number(b.dataset.jump);showQuestion()});updateClock()}}
function confirmSubmit(){let missing=session.answers.filter(a=>a===null).length;if(confirm(`Submit your exam now? ${missing} question(s) are unanswered.`))finish(false)}
function grade(p){return p>=90?[1,'Sehr gut']:p>=80?[2,'Gut']:p>=65?[3,'Befriedigend']:p>50?[4,'Genügend']:[5,'Nicht genügend']}
function finish(auto){if(!session||session.finished)return;stopTimer();let s=session;s.finished=true;let n=s.qs.length,correct=s.qs.reduce((a,q,i)=>a+(s.answers[i]===q.correctIndex?1:0),0),pct=correct/n*100,g=grade(pct);if(s.mode==='exam'){s.qs.forEach((q,i)=>{if(s.answers[i]!==q.correctIndex)wrongIds.add(q.id);else wrongIds.delete(q.id)});persist()}let rows=[...new Set(s.qs.map(q=>q.chapter))].sort((a,b)=>a-b).map(c=>{let idx=s.qs.map((q,i)=>q.chapter===c?i:-1).filter(i=>i>=0),ok=idx.filter(i=>s.answers[i]===s.qs[i].correctIndex).length;return `<tr><td>Chapter ${c}</td><td>${ok} / ${idx.length}</td><td>${(100*ok/idx.length).toFixed(1)}%</td></tr>`}).join('');render(`<div class="overline">${s.mode==='exam'?'Exam Results':'Practice Results'}</div><h2>${auto?'Time is up.':'Session complete.'}</h2><div class="score">${correct} / ${n}</div><div class="statrow"><span class="pill">${pct.toFixed(1)}% correct</span>${s.mode==='exam'?`<span class="pill">Grade ${g[0]} · ${g[1]}</span><span class="pill">${g[0]===5?'Not passed':'Passed'}</span>`:''}</div><h3>Performance by chapter</h3><table class="results"><thead><tr><th>Chapter</th><th>Correct</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table><h3 style="margin-top:30px">Answer review</h3><p class="sub">Open a question to see your answer and the correct option.${s.mode==='practice'?' Explanations are included.':''}</p>${s.qs.map((q,i)=>{let a=s.answers[i],ok=a===q.correctIndex;return `<details class="review"><summary><span class="${ok?'goodtxt':'badtxt'}">${ok?'✓':'✕'}</span> ${i+1}. ${esc(q.question)}</summary><p class="muted">Chapter ${q.chapter} · ${esc(q.difficulty)}</p><p><strong>Your answer:</strong> ${a===null?'Not answered':`${'ABCD'[a]}. ${esc(q.options[a])}`}</p><p class="goodtxt"><strong>Correct answer:</strong> ${'ABCD'[q.correctIndex]}. ${esc(q.options[q.correctIndex])}</p>${s.mode==='practice'?`<p><strong>Explanation:</strong> ${esc(q.explanation)}</p>`:''}</details>`}).join('')}<div class="actions"><button class="btn" id="home">Back to start</button><button class="btn secondary" id="again">${s.mode==='exam'?'New exam':'Practice again'}</button></div>`);$('#home').onclick=home;$('#again').onclick=()=>s.mode==='exam'?examIntro():setup()}
async function load(){try{let res=await fetch('./questions.json',{cache:'no-store'});if(!res.ok)throw Error(`HTTP ${res.status}`);let data=await res.json();if(!Array.isArray(data)||data.length<60||data.some(q=>!Number.isInteger(q.chapter)||q.chapter<1||q.chapter>8||!['easy','medium','hard'].includes(q.difficulty)||!Array.isArray(q.options)||q.options.length!==4||!Number.isInteger(q.correctIndex)||q.correctIndex<0||q.correctIndex>3||typeof q.question!=='string'||typeof q.explanation!=='string'||typeof q.id!=='string'))throw Error('Question file is incomplete or has an unexpected format.');bank=data;home()}catch(e){render(`<div class="overline">Setup</div><h2>Questions could not be loaded.</h2><div class="error">${esc(e.message)}</div><p>Make sure <strong>index.html</strong> and <strong>questions.json</strong> are in the same GitHub repository folder. Open the site using GitHub Pages (not by opening the HTML file directly from your device).</p>`)}}
load();
</script></body></html>
